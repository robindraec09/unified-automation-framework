<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accounts | Harbourline Bank</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="accounts">
    <div id="app-header"></div>
    <main class="page">
      <h1>Your accounts</h1>
      <div class="alert alert-error" role="alert" data-testid="page-error" hidden></div>
      <section class="accounts" aria-label="Accounts" data-testid="account-list" aria-busy="true"></section>
      <section class="card summary" aria-label="Net position">
        <span>Net position across all accounts</span>
        <span class="money big" data-testid="net-position"></span>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
