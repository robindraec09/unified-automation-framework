# Unified Automation Framework CI (GitHub Actions)
#
# Everything runs inside the same containers as locally (compose.yaml): the runner only needs Docker.
# Stage 1 (works with no secrets): static checks, API, web, ETL, Harbourline Bank, and Harbourline Mobile
#   on an Android emulator in Docker (main, nightly, manual).
# Stage 2: set WEB_USER / WEB_PASSWORD / API_TOKEN secrets and TEST_ENV for your real apps.
# Stage 3: set repo variable MOBILE_ENABLED=true + CLOUD_USER / CLOUD_KEY secrets for device-cloud runs.
# See docs/CI.md for the full rollout plan.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *" # nightly, 14:00 UTC = midnight-1am Sydney
  workflow_dispatch:
    inputs:
      env:
        description: Target environment (config/env/<name>.json)
        default: dev
      grep:
        description: Optional tag filter, e.g. @smoke
        default: ""

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TEST_ENV: ${{ inputs.env || vars.TEST_ENV || 'dev' }}
  WEB_USER: ${{ secrets.WEB_USER }}
  WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
  API_TOKEN: ${{ secrets.API_TOKEN }}
  # PRs run smoke only; main, nightly and manual runs run everything (or the manual filter)
  GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
  # Run Playwright in the tests container, passing CI and secrets through. Reports land in ./build.
  RUN_TESTS: docker compose run --rm --build -e CI -e TEST_ENV -e WEB_USER -e WEB_PASSWORD -e API_TOKEN

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm --build --no-deps --entrypoint sh tests -c "pnpm typecheck && pnpm lint"

  api:
    name: API
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: $RUN_TESTS --no-deps tests --project=api ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-api, path: build/reports/blob, retention-days: 7 }

  web:
    name: Web (shard ${{ matrix.shard }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      # The tests image ships every browser: nightly covers all of them
      - name: Run web tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PROJECTS="--project=web-chromium --project=web-firefox --project=web-webkit --project=mobile-web"
          else
            PROJECTS="--project=web-chromium"
          fi
          $RUN_TESTS --no-deps tests $PROJECTS ${GREP:+--grep "$GREP"} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "blob-web-${{ strategy.job-index }}", path: build/reports/blob, retention-days: 7 }

  etl:
    name: ETL
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait source-db warehouse-db
      - run: $RUN_TESTS --no-deps tests --project=etl ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-etl, path: build/reports/blob, retention-days: 7 }

  bank:
    name: Bank (Docker)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 17 + seed job + app image; --wait returns once the app's healthcheck passes
      - run: docker compose up -d --build --wait bank-app
      # The tests container sets BANK_REQUIRED=1: a bank that is down fails the job instead of skipping
      - run: $RUN_TESTS --no-deps tests --project=bank-api --project=bank-web ${GREP:+--grep "$GREP"}
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color bank-app bank-init bank-db
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-bank, path: build/reports/blob, retention-days: 7 }

  android:
    name: Android (emulator in Docker)
    # A cold emulator boot adds ~10 minutes: main, nightly and manual runs, not every PR
    if: github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub's Linux runners have KVM, but /dev/kvm is root:kvm 0660 and the emulator in the image runs as
      # a non-root user. GitHub's documented fix for Android emulators: open the device up with a udev rule.
      # The runner image ships ~25 GB of toolchains this job never uses; the emulator, SDK and test images
      # need the room (without it the emulator exits: "not enough disk space to run avd").
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # Builds the APK, boots Android 14 with KVM, starts Appium and the bank (see docker/mobile)
      - run: docker compose --profile mobile up -d --build --wait android android-proxy
      # The tests container sets MOBILE_REQUIRED=1: no emulator fails the job instead of skipping
      - run: $RUN_TESTS --no-deps tests --project=bank-android ${GREP:+--grep "$GREP"}
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "== runner: $(nproc) CPUs"; free -m; df -h /; ls -l /dev/kvm
          echo "== kvm-init"; docker compose --profile mobile logs --no-color kvm-init
          echo "== emulator container"
          docker compose --profile mobile exec -T android sh -c 'ls -l /dev/kvm; id; echo "device_status=$(cat device_status)"; tail -80 /home/androidusr/logs/device.stdout.log' || true
          echo "== container logs"
          docker compose --profile mobile logs --no-color --tail 100 android android-proxy bank-app
          docker stats --no-stream
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-android, path: build/reports/blob, retention-days: 7 }

  mobile:
    name: Mobile (device cloud)
    # Off until the repo variable MOBILE_ENABLED is 'true' and cloud secrets exist
    if: vars.MOBILE_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    env:
      MOBILE_ENABLED: "1"
      CLOUD: ${{ vars.CLOUD || 'browserstack' }}
      DEVICE: ${{ vars.DEVICE || 'pixel-8' }}
      CLOUD_USER: ${{ secrets.CLOUD_USER }}
      CLOUD_KEY: ${{ secrets.CLOUD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: >-
          $RUN_TESTS -e MOBILE_ENABLED -e CLOUD -e DEVICE -e CLOUD_USER -e CLOUD_KEY
          --no-deps tests --project=android ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-mobile, path: build/reports/blob, retention-days: 7 }

  report:
    name: Merged report
    if: always()
    needs: [api, web, etl, bank, android, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: build/reports/blob, pattern: blob-*, merge-multiple: true }
      # Run history for the stakeholder trend chart, carried between runs per branch
      - uses: actions/cache@v4
        with:
          path: build/reports/stakeholder/history.json
          key: stakeholder-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stakeholder-history-${{ github.ref_name }}-
            stakeholder-history-main-
      # html (engineers) + stakeholder report (one-page summary), see merge.config.ts
      - run: >-
          docker compose run --rm --build --no-deps --entrypoint pnpm tests
          exec playwright merge-reports --config merge.config.ts build/reports/blob
      - uses: actions/upload-artifact@v4
        with: { name: html-report, path: build/reports/playwright, retention-days: 14 }
      # Both folders in one artifact so the stakeholder page's "detailed report" link works offline
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          retention-days: 30
          path: |
            build/reports/stakeholder
            build/reports/playwright
      - name: Summary
        run: |
          cat build/reports/stakeholder/summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **quality-report** from this run's artifacts and open stakeholder/index.html (one-page summary) or playwright/index.html (engineering detail)." >> $GITHUB_STEP_SUMMARY
