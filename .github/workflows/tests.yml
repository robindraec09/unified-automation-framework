# Unified Automation Framework CI (GitHub Actions)
#
# Stage 1 (works with no secrets): static checks, API, web (Chromium), ETL on local Docker Postgres,
#   and the Harbourline Bank system under test in Docker (docker/bank).
# Stage 2: set WEB_USER / WEB_PASSWORD / API_TOKEN secrets and TEST_ENV for your real apps.
# Stage 3: set repo variable MOBILE_ENABLED=true + CLOUD_USER / CLOUD_KEY secrets for device-cloud runs.
# See docs/CI.md for the full rollout plan.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *" # nightly, 14:00 UTC = midnight-1am Sydney
  workflow_dispatch:
    inputs:
      env:
        description: Target environment (config/env/<name>.json)
        default: dev
      grep:
        description: Optional tag filter, e.g. @smoke
        default: ""

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ inputs.env || vars.TEST_ENV || 'dev' }}
  WEB_USER: ${{ secrets.WEB_USER }}
  WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
  API_TOKEN: ${{ secrets.API_TOKEN }}
  # PRs run smoke only; main, nightly and manual runs run everything (or the manual filter)
  GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  api:
    name: API
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright test --project=api ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-api, path: blob-report, retention-days: 7 }

  web:
    name: Web (shard ${{ matrix.shard }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then pnpm exec playwright install --with-deps
          else pnpm exec playwright install --with-deps chromium; fi
      - name: Run web tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PROJECTS="--project=web-chromium --project=web-firefox --project=web-webkit --project=mobile-web"
          else
            PROJECTS="--project=web-chromium"
          fi
          pnpm playwright test $PROJECTS ${GREP:+--grep "$GREP"} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "blob-web-${{ strategy.job-index }}", path: blob-report, retention-days: 7 }

  etl:
    name: ETL
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker/etl/docker-compose.yml up -d --wait
      - run: pnpm playwright test --project=etl ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-etl, path: blob-report, retention-days: 7 }

  bank:
    name: Bank (Docker)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # PostgreSQL 17 + seed job + app image; --wait returns once the app's healthcheck passes
      - run: docker compose -f docker/bank/docker-compose.yml up -d --build --wait
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright reuses the app container on :4000. BANK_REQUIRED: fail, never skip, if the bank is down.
      - run: pnpm playwright test --project=bank-api --project=bank-web ${GREP:+--grep "$GREP"}
        env: { BANK_REQUIRED: "1" }
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker/bank/docker-compose.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-bank, path: blob-report, retention-days: 7 }

  mobile:
    name: Mobile (device cloud)
    # Off until the repo variable MOBILE_ENABLED is 'true' and cloud secrets exist
    if: vars.MOBILE_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    env:
      MOBILE_ENABLED: "1"
      CLOUD: ${{ vars.CLOUD || 'browserstack' }}
      DEVICE: ${{ vars.DEVICE || 'pixel-8' }}
      CLOUD_USER: ${{ secrets.CLOUD_USER }}
      CLOUD_KEY: ${{ secrets.CLOUD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright test --project=android ${GREP:+--grep "$GREP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-mobile, path: blob-report, retention-days: 7 }

  report:
    name: Merged report
    if: always()
    needs: [api, web, etl, bank, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { path: all-blob-reports, pattern: blob-*, merge-multiple: true }
      # Run history for the stakeholder trend chart, carried between runs per branch
      - uses: actions/cache@v4
        with:
          path: stakeholder-report/history.json
          key: stakeholder-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stakeholder-history-${{ github.ref_name }}-
            stakeholder-history-main-
      # html (engineers) + stakeholder-report (one-page summary), see merge.config.ts
      - run: pnpm playwright merge-reports --config merge.config.ts ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with: { name: html-report, path: playwright-report, retention-days: 14 }
      # Both folders in one artifact so the stakeholder page's "detailed report" link works offline
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          retention-days: 30
          path: |
            stakeholder-report
            playwright-report
      - name: Summary
        run: |
          cat stakeholder-report/summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **quality-report** from this run's artifacts and open stakeholder-report/index.html (one-page summary) or playwright-report/index.html (engineering detail)." >> $GITHUB_STEP_SUMMARY
