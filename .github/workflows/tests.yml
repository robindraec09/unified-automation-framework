name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *" # nightly, 14:00 UTC = midnight-1am Sydney
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        default: qa

env:
  TEST_ENV: ${{ github.event.inputs.env || 'dev' }}
  WEB_USER: ${{ secrets.WEB_USER }}
  WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  api:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright test --project=api ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-api, path: blob-report, retention-days: 7 }

  web:
    needs: static
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run web tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm playwright test --project=web-chromium --grep @smoke --shard=${{ matrix.shard }}
          else
            pnpm playwright test --project=web-chromium --project=web-firefox --project=web-webkit --shard=${{ matrix.shard }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "blob-web-${{ strategy.job-index }}", path: blob-report, retention-days: 7 }

  etl:
    needs: static
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'etl')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker/etl/docker-compose.yml up -d --wait
      - run: pnpm playwright test --project=etl
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-etl, path: blob-report, retention-days: 7 }

  mobile:
    # Real devices nightly on a device cloud; set CLOUD_USER / CLOUD_KEY secrets first
    if: github.event_name == 'schedule'
    needs: static
    runs-on: ubuntu-latest
    env:
      MOBILE_ENABLED: "1"
      CLOUD: browserstack
      DEVICE: pixel-8
      CLOUD_USER: ${{ secrets.CLOUD_USER }}
      CLOUD_KEY: ${{ secrets.CLOUD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright test --project=android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: blob-mobile, path: blob-report, retention-days: 7 }

  report:
    if: always()
    needs: [api, web, etl, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { path: all-blob-reports, pattern: blob-*, merge-multiple: true }
      - run: pnpm playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with: { name: html-report, path: playwright-report, retention-days: 14 }
