# Harbourline Bank in containers: PostgreSQL 17 + one-off seed + the app.
#   pnpm bank:up     build, start and wait until healthy  -> http://localhost:4000, DB on localhost:5435
#   pnpm bank:down   stop and delete the data volume
#   pnpm bank:reset  reload the seed data without restarting
# Ports avoid clashes: 5432 = a local PostgreSQL install, 5433/5434 = the ETL demo.
name: harbourline-bank

# Both services build the same Dockerfile (shared build cache). No shared image tag: parallel builds would clash.
x-bank-image: &bank-image
  build:
    context: ../..
    dockerfile: apps/bank/Dockerfile

services:
  bank-db:
    image: postgres:17
    environment:
      POSTGRES_USER: bank_app
      POSTGRES_PASSWORD: bank_app
      POSTGRES_DB: bank
    ports: ['5435:5432']
    volumes:
      - bank-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bank_app -d bank']
      interval: 3s
      retries: 20

  # Creates the schema and seed data on first start only (--if-empty); keeps data across restarts
  bank-init:
    <<: *bank-image
    command: ['apps/bank/node_modules/.bin/tsx', 'apps/bank/scripts/db-init.ts', '--if-empty']
    environment:
      BANK_DB_URL: postgres://bank_app:bank_app@bank-db:5432/bank
      BANK_PUBLIC_URL: http://localhost:4000
    healthcheck:
      disable: true
    depends_on:
      bank-db: { condition: service_healthy }
    restart: 'no'

  bank-app:
    <<: *bank-image
    environment:
      BANK_DB_URL: postgres://bank_app:bank_app@bank-db:5432/bank
      BANK_PUBLIC_URL: http://localhost:4000
      # Test-data endpoints for the framework's bankCustomer fixture. Local/test only.
      BANK_TEST_SUPPORT: '1'
    ports: ['4000:4000']
    depends_on:
      bank-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  bank-data:
