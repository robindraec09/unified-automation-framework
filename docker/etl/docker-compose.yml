# Local ETL sandbox: a source OLTP database and a warehouse, both Postgres.
# pnpm etl:up / pnpm etl:down
services:
  source-db:
    image: postgres:16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: source
    ports: ["5433:5432"]
    volumes:
      - ./init/source.sql:/docker-entrypoint-initdb.d/01-source.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d source"]
      interval: 3s
      retries: 20

  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: warehouse
    ports: ["5434:5432"]
    volumes:
      - ./init/warehouse.sql:/docker-entrypoint-initdb.d/01-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d warehouse"]
      interval: 3s
      retries: 20
